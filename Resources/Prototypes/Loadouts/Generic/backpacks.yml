# Floof - I will be consolidating nearly all the backpacks here because it's stupid that there's 3 folders for different backpack types

# Grey
- type: loadout
  id: LoadoutBackpack
  category: Backpacks
  cost: 0
  exclusive: true
  customColorTint: true
  items:
    - ClothingBackpack
  requirements:
    - !type:CharacterItemGroupRequirement
