- type: entity
  name: Cryptobiolin injector
  id: CryptobiolinInjector
  parent: ChemicalMedipen
  description: Made by SESWC. This item is prefilled with 20u of Cryptobiolin to help you get rid of those pesky psionic weirdo's.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: penacid
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Cryptobiolin
          Quantity: 20

- type: entity
  name: Libidozenithizine Injector
  parent: SpaceMedipen
  id: LibidozenithizineInjector
  description: A rapid dose of Horny. Contains 20 units of Libidozenithizine, use for recreation.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Libidozenithizine
          Quantity: 20

- type: entity
  name: Nocturine Injector
  parent: BurnAutoInjector
  id: NocturineInjector
  description: A rapid dose of Eepy. Contains 15 units of Nocturine, for god's eepiest soldiers.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Nocturine
          Quantity: 15
