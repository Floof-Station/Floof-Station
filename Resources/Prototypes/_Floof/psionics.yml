- type: psionicPower
  id: HypnosisPower
  name: Psionic Hypnosis
  powerCategories:
  - Mentalic
  initializeFunctions:
    - !type:AddPsionicActions
      actions:
      - ActionHypno
    - !type:AddPsionicPowerComponents
      components:
      - type: PsionicHypno
    - !type:PsionicFeedbackPopup
    - !type:PsionicFeedbackSelfChat
      feedbackMessage: hypnosis-power-initialization-feedback
    - !type:PsionicModifyGlimmer
      glimmerModifier: -4
    - !type:AddPsionicAssayFeedback
      assayFeedback: hypnosis-power-feedback
  removalFunctions:
  - !type:RemovePsionicActions
  - !type:RemovePsionicPowerComponents
    components:
    - type: PsionicHypno
  - !type:RemovePsionicStatSources
  - !type:RemoveAssayFeedback
    assayFeedback: hypnosis-power-feedback

- type: psionicPower
  id: GlimmerLeak
  name: GlimmerLeak
  powerCategories:
    - Passive
    - Dangerous
  powerSlotCost: 0
  initializeFunctions:
    - !type:AddPsionicPowerComponents
      components:
      - type: GlimmerSource
        # SecondsPerGlimmer: 15 # Not sure why it's not finding that field
    - !type:AddPsionicAssayFeedback
      assayFeedback: glimmer-leak-power-feedback
  removalFunctions:
    - !type:RemovePsionicPowerComponents
      components:
      - type: GlimmerSource
    - !type:RemoveAssayFeedback
      assayFeedback: glimmer-leak-power-feedback
